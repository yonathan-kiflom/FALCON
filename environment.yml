name: falcon
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip=24.3
  - setuptools=75.6
  - wheel=0.45.1
  - numpy=1.26.4
  - pytorch=2.4.1
  - torchvision=0.19.1
  - pytorch-cuda=12.1
  - openjdk=17
  - pip:
      - transformers==4.49.0
      - tokenizers==0.21.0
      - accelerate==1.2.1
      - peft==0.14.0
      - rfdetr==1.5.2
      - albumentations==1.4.24
      # Supervision and Roboflow require different distribution names for cv2.
      # Keep both metadata requirements on the same binary release.
      - opencv-python==4.10.0.84
      - opencv-python-headless==4.10.0.84
      - scipy==1.13.1
      - pydantic==2.10.6
      - supervision==0.26.1
      - huggingface-hub==0.28.1
      - sentencepiece==0.2.0
      - protobuf==5.29.6
      - safetensors==0.5.2
      - einops==0.8.0
      - Pillow==12.0.0
      - PyYAML==6.0.2
      - pycocotools==2.0.8
      - pycocoevalcap==1.2
      - -e .
